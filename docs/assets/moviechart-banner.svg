<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="mc-banner-title mc-banner-desc">
  <title id="mc-banner-title">MovieChart — find the story in every frame</title>
  <desc id="mc-banner-desc">A deep midnight-navy banner with soft cyan and violet light, understated poster-grid motifs and the MovieChart wordmark above its tagline.</desc>

  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1930"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="mc-glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36E4FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#36E4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mc-glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#C9DDEA"/>
    </linearGradient>
    <linearGradient id="mc-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36E4FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36E4FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mc-poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36E4FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="mc-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36E4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#36E4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Midnight backdrop -->
  <rect width="1200" height="360" fill="url(#mc-bg)"/>

  <!-- Atmospheric light -->
  <ellipse cx="962" cy="118" rx="400" ry="280" fill="url(#mc-glow-cyan)"/>
  <ellipse cx="212" cy="322" rx="440" ry="250" fill="url(#mc-glow-violet)"/>

  <!-- Cinematic guide lines -->
  <rect x="72" y="72" width="360" height="1.4" fill="url(#mc-fade)"/>
  <rect x="768" y="288" width="360" height="1.4" fill="url(#mc-fade)" opacity="0.6"/>

  <!-- Understated poster grid, fading into the frame -->
  <g stroke="#36E4FF" stroke-opacity="0.22" stroke-width="1.2">
    <rect x="908" y="196" width="46" height="68" rx="8" fill="url(#mc-poster)"/>
    <rect x="968" y="182" width="46" height="82" rx="8" fill="url(#mc-poster)" stroke-opacity="0.16"/>
    <rect x="1028" y="196" width="46" height="68" rx="8" fill="url(#mc-poster)" stroke="#8B5CF6" stroke-opacity="0.18"/>
    <rect x="1088" y="182" width="46" height="82" rx="8" fill="url(#mc-poster)" stroke-opacity="0.10"/>
  </g>
  <g stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1.2">
    <rect x="66" y="212" width="42" height="62" rx="8" fill="none"/>
    <rect x="120" y="198" width="42" height="76" rx="8" fill="none" stroke-opacity="0.10"/>
    <rect x="174" y="212" width="42" height="62" rx="8" fill="none" stroke-opacity="0.06"/>
  </g>

  <!-- Letterbox hints -->
  <rect width="1200" height="10" fill="#050B14" opacity="0.55"/>
  <rect y="350" width="1200" height="10" fill="#050B14" opacity="0.55"/>

  <!-- Wordmark -->
  <g font-family="'Manrope','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="140" fill="#94A3B8" font-size="14" font-weight="600" letter-spacing="6">MOVIES · SERIES · ANIME · DISCOVERY</text>
    <text x="600" y="236" fill="url(#mc-name)" font-size="94" font-weight="800" letter-spacing="-2.5">MovieChart</text>
    <text x="600" y="288" fill="#94A3B8" font-size="23" font-weight="500" letter-spacing="0.5">Find the story in every frame.</text>
    <rect x="520" y="312" width="160" height="2" rx="1" fill="url(#mc-rule)"/>
  </g>
</svg>
