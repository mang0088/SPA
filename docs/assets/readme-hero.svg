    <path d="M12 156c21-48 39-35 50-67 13 31 22 31 42 7v105H12z" fill="#07111f" fill-opacity=".58"/>
    <circle cx="79" cy="69" r="17" fill="#f4f7fb" fill-opacity=".45"/>
    <rect x="16" y="173" width="63" height="4" rx="2" fill="#e9f8ff" fill-opacity=".62"/>
    <rect x="16" y="184" width="38" height="3" rx="1.5" fill="#e9f8ff" fill-opacity=".34"/>
    <rect x="129" y="0" width="116" height="194" rx="9" fill="url(#posterB)" stroke="#c1a8ff" stroke-opacity=".5"/>
    <path d="M141 28h92M141 39h70" stroke="#eee8ff" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="187" cy="94" r="35" fill="none" stroke="#c8b3ff" stroke-opacity=".54"/>
    <path d="M158 145h59M158 156h42" stroke="#eee8ff" stroke-opacity=".4" stroke-width="3"/>
    <rect x="258" y="32" width="116" height="194" rx="9" fill="#10223d" fill-opacity=".78" stroke="#93b9d7" stroke-opacity=".42"/>
