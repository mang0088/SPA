  <rect width="1200" height="360" rx="24" fill="url(#grain)" opacity=".2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="151" fill="#9cabbf" font-size="13" font-weight="700" letter-spacing="4">A CALMER WAY TO DISCOVER</text>
    <text x="108" y="222" fill="#f4f7fb" font-size="62" font-weight="700" letter-spacing="-2">Stillframe</text>
    <path d="M112 243h62" stroke="#36e4ff" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="278" fill="#d4deea" font-size="20">Find the story in every frame.</text>
    <text x="112" y="309" fill="#94a3b8" font-size="13" letter-spacing=".4">MOVIES  ·  SERIES  ·  ANIME  ·  WHAT’S NEXT</text>
