<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Stillframe — find the story in every frame</title>
  <desc id="desc">A cinematic midnight-blue banner with cyan and violet light, fine film-frame lines, and an abstract gallery of poster shapes.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(260 46) rotate(47) scale(440 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36e4ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#36e4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1035 320) rotate(-126) scale(430 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#36e4ff" stop-opacity=".54"/>
      <stop offset="1" stop-color="#173956" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#152340" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".45" fill="#fff" fill-opacity=".13"/>
      <circle cx="6" cy="5" r=".4" fill="#fff" fill-opacity=".1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#night)"/>
  <rect width="1200" height="360" rx="24" fill="url(#cyanGlow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#violetGlow)"/>
  <g opacity=".7" fill="none" stroke="#c5d3e8">
    <rect x="28" y="28" width="1144" height="304" rx="16" stroke-opacity=".14"/>
    <path d="M48 56h44M48 70h22M1152 56h-44M1152 70h-22M48 304h44M48 290h22M1152 304h-44M1152 290h-22" stroke-opacity=".3" stroke-width="1.5"/>
  </g>
  <g opacity=".24" fill="#b8c8df">
    <circle cx="68" cy="92" r="2"/><circle cx="68" cy="112" r="2"/><circle cx="68" cy="132" r="2"/><circle cx="68" cy="152" r="2"/>
    <circle cx="68" cy="172" r="2"/><circle cx="68" cy="192" r="2"/><circle cx="68" cy="212" r="2"/><circle cx="68" cy="232" r="2"/>
    <circle cx="68" cy="252" r="2"/><circle cx="1132" cy="92" r="2"/><circle cx="1132" cy="112" r="2"/><circle cx="1132" cy="132" r="2"/>
    <circle cx="1132" cy="152" r="2"/><circle cx="1132" cy="172" r="2"/><circle cx="1132" cy="192" r="2"/><circle cx="1132" cy="212" r="2"/>
    <circle cx="1132" cy="232" r="2"/><circle cx="1132" cy="252" r="2"/>
  </g>
